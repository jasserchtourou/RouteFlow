[project]
name = "routeflow-backend"
version = "0.1.0"
description = "RouteFlow logistics intelligence platform - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.20.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "pytest-randomly>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d postgres)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # generated code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF", "PT", "T20", "PERF", "PIE", "RET", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQLAlchemy reads Mapped[uuid.UUID] / Mapped[datetime] annotations at runtime, so these imports
# must stay real imports (TC003 would move them under TYPE_CHECKING and break the mapping).
"app/modules/*/models.py" = ["TC003"]
"app/core/base.py" = ["TC003"]
"app/seed/**" = ["E501", "S311", "T201"]  # data-heavy; random is not security-relevant; CLI prints

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no type stubs

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this, coverage silently loses the code
# that runs after every `await session...` and reports it as untested.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95  # enforced when running `pytest --cov`
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
